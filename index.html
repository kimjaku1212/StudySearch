<!DOCTYPE html>
<html>
<head>
  <title>StudySearch Pro</title>

  <style>
    body {
      font-family: Arial;
      background: #ffd6e7;
      margin: 0;
      padding: 0;
    }

    .app {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: #fff5e6;
      outline: none;
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      font-size: 14px;
    }

    button.active {
      background: #b6f7b0;
    }

    .result {
      background: white;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .highlight {
      background: #b6f7b0;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .empty {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }

    .bookmark-btn {
      margin-top: 8px;
      font-size: 12px;
      background: #f1f1f1;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">📚 StudySearch Pro</div>

  <input type="text" id="searchBox" placeholder="Search notes..." onkeyup="searchText()">

  <div class="controls">
    <button onclick="toggleExamMode()" id="examBtn">🧠 Exam Mode OFF</button>
    <button onclick="showBookmarks()">⭐ Bookmarks</button>
    <button onclick="clearSearch()">🔄 Reset</button>
  </div>

  <div id="results" class="empty">Start searching...</div>

</div>

<script>

  ],

    "Dielectric increases capacitance by factor K."
  ],

  "Current Electricity": [

    "Current I = neAvd.",
    "Resistance increases with temperature.",
    "Kirchhoff’s laws conserve charge and energy."

  ],

    "RMS value of AC current is I0/√2.",

  ],

  "Dual Nature of Radiation": [
    "Photoelectric effect shows particle nature of light.",
    "Einstein equation: Kmax = hν - φ.",
    "De Broglie wavelength λ = h/p."
  ],

  "Atoms and Nuclei": [
    "Bohr model explains quantized orbits.",
    "Energy levels: En = -13.6 Z²/n² eV.",
    "Nuclear binding energy holds nucleus together."
  ],

  "Semiconductors": [
    "Semiconductors have band gap between VB and CB.",
    "PN junction allows current flow in one direction.",
    "Diodes act as rectifiers."
  ]
},

  chemistry: {
  "Solutions": [
    "Molarity = moles of solute / volume of solution.",
    "Raoult’s law: vapor pressure is proportional to mole fraction.",
    "Boiling point elevation: ΔTb = i Kb m.",
    "Osmotic pressure: π = iCRT.",
    "Van’t Hoff factor shows effect of solute particles."
  ],

  "Electrochemistry": [

  ],

    "Alpha and beta glucose are anomers."
  ]

  maths: {
    "Calculus": [
      "Derivative represents rate of change.",
      "Integration is reverse of differentiation."
    ]
  }
}

let examMode = false;
let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];

/* ---------------- EXAM MODE ---------------- */
function toggleExamMode() {
  examMode = !examMode;
  document.getElementById("examBtn").classList.toggle("active");
  document.getElementById("examBtn").innerText =
    examMode ? "🧠 Exam Mode ON" : "🧠 Exam Mode OFF";

  searchText();
}

/* ---------------- BOOKMARK ---------------- */
function saveBookmark(text) {
  if (!bookmarks.includes(text)) {
    bookmarks.push(text);
    localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
  }
}

/* ---------------- SHOW BOOKMARKS ---------------- */
function showBookmarks() {
  let resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (bookmarks.length === 0) {
    resultsDiv.innerHTML = "<div class='empty'>No bookmarks yet ⭐</div>";
    return;
  }

  bookmarks.forEach(item => {
    resultsDiv.innerHTML += `
      <div class="result">⭐ ${item}</div>
    `;
  });
}

/* ---------------- RESET ---------------- */
function clearSearch() {
  document.getElementById("searchBox").value = "";
  document.getElementById("results").innerHTML =
    "<div class='empty'>Start searching...</div>";
}

/* ---------------- SEARCH ---------------- */
function searchText() {
  let query = document.getElementById("searchBox").value.toLowerCase();
  let resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (query === "") {
    resultsDiv.innerHTML = "<div class='empty'>Start typing...</div>";
    return;
  }

  let found = false;

  for (let subject in DATA) {
    for (let chapter in DATA[subject]) {

      DATA[subject][chapter].forEach(line => {

        // Simple exam mode filter (safe version)
        if (examMode) {
          if (!line.includes("=") &&
              !line.includes("law") &&
              !line.includes(":") &&
              !line.includes("force") &&
              !line.includes("pressure")) {
            return;
          }
        }

        if (line.toLowerCase().includes(query)) {
          found = true;

          let highlighted = line.replace(
            new RegExp(query, "gi"),
            match => `<span class="highlight">${match}</span>`
          );

          resultsDiv.innerHTML += `
            <div class="result">
              <b>${subject.toUpperCase()} → ${chapter}</b><br>
              ${highlighted}
              <br>
              <button class="bookmark-btn" onclick="saveBookmark('${line}')">⭐ Save</button>
            </div>
          `;
        }

      });

    }
  }

  if (!found) {
    resultsDiv.innerHTML = "<div class='empty'>No results found 😕</div>";
  }
}
</script>

</body>
</html>
